[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "endoscopy-vlm-evaluation"
version = "0.2.0"
description = "Aggregate analysis and visualization code for an endoscopy VLM manuscript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "pillow>=10.0", "scikit-learn>=1.4", "scipy>=1.11", "seaborn>=0.13"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
